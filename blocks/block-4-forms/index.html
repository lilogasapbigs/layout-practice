<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <title>Block-4-Формы</title>
</head>

<body>
    <header>
        <h1>Формы</h1>
    </header>
    <hr />

    <main>
        <section>
            <h2>Регистрация</h2>

            <form action="#" method="post">
                <p>
                    <label for="first-name">Имя</label><br>
                    <input type="text" id="first-name" name="first-name" required>
                </p>

                <p>
                    <label for="last-name">Фамилия</label><br>
                    <input type="text" id="last-name" name="last-name" required>
                </p>

                <p>
                    <label for="email">Email</label><br>
                    <input type="email" id="email" name="email" required>
                </p>

                <p>
                    <label for="phone">Телефон</label><br>
                    <input type="tel" id="phone" name="phone">
                </p>

                <p>
                    <label for="password">Пароль</label><br>
                    <input type="password" id="password" name="password" required>
                </p>

                <p>
                    <label for="password-repeat">Подтверждение пароля</label><br>
                    <input type="password" id="password-repeat" name="password-repeat" required>
                </p>

                <p>
                    <label for="birth-date">Дата рождения</label><br>
                    <input type="date" id="birth-date" name="birth-date">
                </p>

                <p>Пол</p>
                <p>
                    <label><input type="radio" name="gender" value="male"> мужской</label><br>
                    <label><input type="radio" name="gender" value="female"> женский</label>
                </p>

                <p>
                    <label>
                        <input type="checkbox" name="agreement" required>
                        согласен с условиями
                    </label>
                </p>

                <button type="submit">Отправить</button>
                <button type="reset">Очистить</button>
            </form>
        </section>

        <section>
            <h2>Фильтр каталога</h2>

            <form action="#" method="get">
                <p>
                    <label for="search">Поиск</label><br>
                    <input type="search" id="search" name="search">
                </p>

                <p>
                    <label for="category">Категория</label><br>
                    <select id="category" name="category">
                        <option value="all">Все</option>
                        <option value="books">Книги</option>
                        <option value="games">Игры</option>
                        <option value="tech">Техника</option>
                    </select>
                </p>

                <p>
                    <label for="sort">Сортировка</label><br>
                    <select id="sort" name="sort">
                        <option value="popular">По популярности</option>
                        <option value="cheap">Сначала дешевые</option>
                        <option value="expensive">Сначала дорогие</option>
                    </select>
                </p>

                <p>
                    <label for="price">Цена до</label><br>
                    <input type="range" id="price" name="price" min="0" max="100000" step="1000">
                </p>

                <p>Дополнительно</p>
                <p>
                    <label><input type="checkbox" name="only-new"> только новые</label><br>
                    <label><input type="checkbox" name="delivery"> с доставкой</label><br>
                    <label><input type="checkbox" name="discount"> со скидкой</label>
                </p>

                <p>Состояние</p>
                <p>
                    <label><input type="radio" name="condition" value="any" checked> любое</label><br>
                    <label><input type="radio" name="condition" value="new"> новое</label><br>
                    <label><input type="radio" name="condition" value="used"> б/у</label>
                </p>

                <button type="submit">Применить</button>
                <button type="reset">Сбросить</button>
            </form>
        </section>

        <section>
            <h2>Обратная связь</h2>

            <form action="#" method="post" enctype="multipart/form-data">
                <p>
                    <label for="feedback-name">Имя</label><br>
                    <input type="text" id="feedback-name" name="feedback-name" required>
                </p>

                <p>
                    <label for="feedback-email">Email</label><br>
                    <input type="email" id="feedback-email" name="feedback-email" required>
                </p>

                <p>
                    <label for="feedback-topic">Тема</label><br>
                    <input type="text" id="feedback-topic" name="feedback-topic">
                </p>

                <p>
                    <label for="feedback-message">Сообщение</label><br>
                    <textarea id="feedback-message" name="feedback-message" rows="5" cols="40" required></textarea>
                </p>

                <p>
                    <label for="priority">Приоритет</label><br>
                    <select id="priority" name="priority">
                        <option value="low">Низкий</option>
                        <option value="medium">Средний</option>
                        <option value="high">Высокий</option>
                    </select>
                </p>

                <p>
                    <label for="file">Приложить файл</label><br>
                    <input type="file" id="file" name="file">
                </p>

                <button type="submit">Отправить</button>
            </form>
        </section>
    </main>
</body>

</html>
