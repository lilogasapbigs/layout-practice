<!DOCTYPE html>
<html lang="ru">

                <article class="grid-card">Товар 3</article>
                <article class="grid-card">Товар 4</article>
                <article class="grid-card">Товар 5</article>
                <article class="grid-card">Товар 6</article>
                <article class="grid-card">Товар 7</article>
                <article class="grid-card">Товар 8</article>
                <article class="grid-card">Товар 9</article>

                <article class="grid-card">Товар 12</article>

        </section>

        <section>
            <h2>Галерея</h2>
            <div class="gallery">
                <img src="../../assets/img/photo.svg" alt="Фото 1">
                <img src="../../assets/img/photo.svg" alt="Фото 2">
                <img src="../../assets/img/photo.svg" alt="Фото 3">
                <img src="../../assets/img/photo.svg" alt="Фото 4">
                <img src="../../assets/img/photo.svg" alt="Фото 5">
                <img src="../../assets/img/photo.svg" alt="Фото 6">
                <img src="../../assets/img/photo.svg" alt="Фото 7">
                <img src="../../assets/img/photo.svg" alt="Фото 8">
                <img src="../../assets/img/photo.svg" alt="Фото 9">
                <img src="../../assets/img/photo.svg" alt="Фото 10">
            </div>
        </section>

        <section>
            <h2>Главная страница</h2>
            <div class="home-page">
                <div class="home-header">Шапка сайта</div>
                <div class="banner">Баннер</div>
                <div class="advantages">
                    <div>Быстро</div>
                    <div>Просто</div>
                    <div>Понятно</div>
                </div>
                <div class="home-catalog">
                    <div>Товар</div>
                    <div>Товар</div>
                    <div>Товар</div>
                </div>
                <div class="reviews">
                    <div>Отзыв 1</div>
                    <div>Отзыв 2</div>
                </div>
                <div class="home-footer">Подвал</div>

    <footer>
        <p>2026, учебная страница.</p>
    </footer>
</body>

</html>
