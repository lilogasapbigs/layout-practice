<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <title>Block-8-UI</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <header class="app-header">
        <div class="logo">Shop</div>
        <nav class="main-menu">
            <a href="#catalog">Каталог</a>
            <a href="#orders">Заказы</a>
            <a href="#profile">Профиль</a>
        </nav>
        <input type="search" placeholder="Поиск">
        <button type="button">Войти</button>
    </header>

    <main>
        <h1>Flex интерфейс</h1>

        <section class="toolbar">
            <h2>Товары</h2>
            <div class="toolbar-actions">
                <input type="search" placeholder="Найти товар">
                <button type="button">Фильтр</button>
                <button type="button">Экспорт</button>
                <button class="primary-button" type="button">Добавить</button>
            </div>
        </section>

        <section id="catalog">
            <h2>Карточка товара</h2>
            <article class="product-card">
                <div class="product-top">
                    <img src="../../assets/img/photo.svg" alt="Фото товара">
                    <div>
                        <h3>Клавиатура</h3>
                        <p>Обычная клавиатура для учебы, игр и переписок.</p>
                    </div>
                </div>

                <div class="product-info">
                    <span>Рейтинг: 4.8</span>
                    <span>В наличии</span>
                </div>

                <div class="product-bottom">
                    <strong>2990 рублей</strong>
                    <div class="product-buttons">
                        <button type="button">В корзину</button>
                        <button type="button">Подробнее</button>
                    </div>
                </div>
            </article>
        </section>
    </main>
</body>

</html>
