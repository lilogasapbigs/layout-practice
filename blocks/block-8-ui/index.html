<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <title>Block-8-UI</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <header class="app-header">
        <div class="logo">Shop</div>
        <nav class="main-menu">
            <a href="#catalog">Каталог</a>
            <a href="#orders">Заказы</a>
            <a href="#profile">Профиль</a>
        </nav>
        <input type="search" placeholder="Поиск">
        <button type="button">Войти</button>
    </header>

    <main>
        <h1>Flex интерфейс</h1>

        <section class="toolbar">
            <h2>Товары</h2>
            <div class="toolbar-actions">
                <input type="search" placeholder="Найти товар">
                <button type="button">Фильтр</button>
                <button type="button">Экспорт</button>
                <button class="primary-button" type="button">Добавить</button>
            </div>
        </section>
    </main>
</body>

</html>
