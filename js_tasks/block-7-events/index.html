<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>блок 7. события</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>блок 7. события</h1>
    </header>

    <main>
        <section><h2>Задача 1. Кнопка счётчика</h2><button id="counter-button" type="button">+1</button><span id="counter-value">0</span></section>
        <section><h2>Задача 2. Live input</h2><input id="live-input" placeholder="Введите текст"><div id="live-output" class="result">Тут будет текст</div></section>
        <section><h2>Задача 3. Форма регистрации</h2><form id="event-register"><input name="name" placeholder="Имя"><input name="email" placeholder="Email"><button type="submit">Отправить</button></form><div id="event-register-result" class="result"></div></section>
        <section><h2>Задача 4. TODO список</h2><input id="todo-input" placeholder="Задача"><button id="todo-add" type="button">Добавить</button><ul id="todo-list"></ul><div id="todo-stats" class="result"></div></section>
        <section><h2>Задача 5. Делегирование событий</h2><div id="delegation-products" class="cards"></div><div id="delegation-message" class="result"></div></section>
        <section><h2>Задача 6. Фильтр каталога</h2><input id="event-search" placeholder="Поиск"><select id="event-category"><option value="all">Все</option><option value="Периферия">Периферия</option><option value="Техника">Техника</option></select><select id="event-sort"><option value="none">Без сортировки</option><option value="asc">Дешевле</option><option value="desc">Дороже</option></select><div id="event-catalog" class="cards"></div></section>

    </main>

    <script src="script.js"></script>
</body>
</html>
