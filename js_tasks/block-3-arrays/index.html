<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>блок 3. массивы</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>блок 3. массивы</h1>
    </header>

    <main>
        <section>
            <h2>Задача 1. Каталог товаров из массива</h2>
            <button id="array-catalog-button" type="button">Показать каталог</button>
            <div id="array-catalog" class="cards"></div>
        </section>
        <section>
            <h2>Задача 2. Фильтрация товаров</h2>
            <input id="array-search" type="text" placeholder="Поиск товара">
            <button id="array-search-button" type="button">Найти</button>
            <div id="array-search-result" class="cards"></div>
        </section>
        <section>
            <h2>Задача 3. Поиск пользователя по id</h2>
            <input id="user-id-input" type="number" placeholder="id">
            <button id="user-id-button" type="button">Найти</button>
            <div id="user-id-result" class="result"></div>
        </section>
        <section>
            <h2>Задача 4. Преобразование цен</h2>
            <button id="prices-button" type="button">Показать цены</button>
            <ul id="prices-list"></ul>
        </section>

    </main>

    <script src="script.js"></script>
</body>
</html>
