<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>блок 2. функции и циклы</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>блок 2. функции и циклы</h1>
    </header>

    <main>
        <section>
            <h2>Задача 1. Калькулятор</h2>
            <input id="calc-a" type="number" placeholder="Первое число">
            <select id="calc-operation">
                <option value="add">+</option>
                <option value="subtract">-</option>
                <option value="multiply">×</option>
                <option value="divide">÷</option>
            </select>
            <input id="calc-b" type="number" placeholder="Второе число">
            <button id="calc-button" type="button">Посчитать</button>
            <div id="calc-result" class="result"></div>
        </section>
        <section>
            <h2>Задача 2. Таблица умножения</h2>
            <input id="multiply-number" type="number" placeholder="Число">
            <button id="multiply-button" type="button">Показать</button>
            <div id="multiply-result" class="result"></div>
        </section>

    </main>

    <script src="script.js"></script>
</body>
</html>
