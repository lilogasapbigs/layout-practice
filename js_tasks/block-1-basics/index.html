<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>блок 1. основы js</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>блок 1. основы js</h1>
    </header>

    <main>
        <section>
            <h2>Задача 1. Кнопка приветствия</h2>
            <label for="name-input">Имя</label><br>
            <input id="name-input" type="text" placeholder="Олег">
            <button id="greet-button" type="button">Поздороваться</button>
            <div id="greet-result" class="result"></div>
        </section>
        <section>
            <h2>Задача 2. Мини-калькулятор скидки</h2>
            <label for="discount-price">Цена</label><br>
            <input id="discount-price" type="number" placeholder="2000">
            <br>
            <label for="discount-percent">Скидка, %</label><br>
            <input id="discount-percent" type="number" placeholder="10">
            <button id="discount-button" type="button">Посчитать</button>
            <div id="discount-result" class="result"></div>
        </section>
        <section>
            <h2>Задача 3. Проверка возраста</h2>
            <input id="age-input" type="number" placeholder="Возраст">
            <button id="age-button" type="button">Проверить</button>
            <div id="age-result" class="result"></div>
        </section>
        <section>
            <h2>Задача 4. Проверка формы регистрации</h2>
            <form id="register-form" action="#">
                <input id="register-name" type="text" placeholder="Имя"><br>
                <input id="register-email" type="email" placeholder="Email"><br>
                <input id="register-password" type="password" placeholder="Пароль"><br>
                <button type="submit">Проверить</button>
            </form>
            <div id="register-result" class="result"></div>
        </section>
        <section>
            <h2>Задача 5. Проверка цены товара</h2>
            <input id="product-price" type="number" placeholder="Цена">
            <button id="product-price-button" type="button">Проверить</button>
            <div id="product-price-result" class="result"></div>
        </section>
        <section>
            <h2>Задача 6. Переключатель состояния</h2>
            <button id="toggle-button" type="button">Переключить</button>
            <div id="toggle-state" class="state-block state-off">Выключено</div>
        </section>

    </main>

    <script src="script.js"></script>
</body>
</html>
